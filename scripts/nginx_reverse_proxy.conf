# NEXUS REMOTE Nginx Reverse Proxy Configuration
# Place in /etc/nginx/sites-available/nexus-remote and symlink to sites-enabled

# WebSocket Connection Upgrade Map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name remote.yourdomain.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name remote.yourdomain.com;

    # SSL Certificates (managed via Let's Encrypt / Certbot or Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/remote.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remote.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Max body size for file transfers
    client_max_body_size 64M;

    # Reverse proxy to Limbo Python backend
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Client IP and proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cloudflare header passthrough
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Timeouts for long-lived WebSocket sessions
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
