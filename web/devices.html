<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Registry - NEXUS REMOTE</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <div>
          <div class="brand-title">NEXUS</div>
          <span class="brand-badge">Remote</span>
        </div>
      </div>

      <ul class="nav-links">
        <li class="nav-item"><a href="/dashboard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Overview
        </a></li>
        <li class="nav-item active"><a href="/devices">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
          Fleet
        </a></li>
        <li class="nav-item"><a href="/sessions">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          Audit Log
        </a></li>
        <li class="nav-item"><a href="/settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Console Config
        </a></li>
      </ul>

      <div class="sidebar-footer">
        <div class="user-badge">
          <div class="user-avatar" id="avatar-initials">OP</div>
          <div class="user-info">
            <div class="user-name" id="user-display-name">Operator</div>
            <div class="user-email" id="user-display-email">loading...</div>
          </div>
        </div>
        <button class="btn btn-secondary btn-sm" style="width: 100%;" onclick="API.logout()">
          Terminate Session
        </button>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <main class="main-wrapper">
      <header class="top-bar">
        <h1 class="top-bar-title">Fleet Registry</h1>
        <div class="top-bar-actions">
          <div style="position: relative; display: flex; align-items: center;">
            <svg style="position: absolute; left: 10px; color: var(--text-muted);" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="device-search" class="form-input" placeholder="Search fleet..." style="width: 260px; padding: 0.45rem 0.75rem 0.45rem 2rem; font-size: 0.825rem;" oninput="filterDevices()">
          </div>
          <button class="btn btn-primary btn-sm" onclick="window.location.href='/dashboard'">
            + Pair Device
          </button>
        </div>
      </header>

      <div class="content-body">
        <div class="glass-panel" style="padding: 1.5rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
            <h2 style="font-size: 1.1rem; font-weight: 600;">Managed Nodes</h2>
            <div id="fleet-count" style="font-size: 0.8rem; color: var(--text-muted); font-family: var(--font-mono);">0 NODES ACTIVE</div>
          </div>
          
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Device Identifier</th>
                  <th>Hardware Profile</th>
                  <th>Core OS</th>
                  <th>Status</th>
                  <th>Energy</th>
                  <th>Available Storage</th>
                  <th>Last Uplink</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="devices-tbody">
                <tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 4rem;">Decrypting fleet records...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/websocket.js"></script>
  <script>
    const user = API.getUser();
    if (user) {
      document.getElementById('user-display-name').innerText = user.name;
      document.getElementById('user-display-email').innerText = user.email;
      const initials = user.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      document.getElementById('avatar-initials').innerText = initials || 'OP';
    }

    let allDevices = [];

    async function loadDevices() {
      try {
        const res = await API.get('/api/v1/devices');
        allDevices = res.devices || [];
        document.getElementById('fleet-count').innerText = `${allDevices.length} NODES DISCOVERED`;
        filterDevices();
      } catch (e) {
        console.error(e);
      }
    }

    function filterDevices() {
      const q = (document.getElementById('device-search').value || '').toLowerCase();
      const tbody = document.getElementById('devices-tbody');

      const filtered = allDevices.filter(d =>
        d.name.toLowerCase().includes(q) ||
        d.model.toLowerCase().includes(q) ||
        d.id.toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 4rem;">
          <div style="font-size: 2rem; margin-bottom: 1rem; opacity: 0.2;">🔍</div>
          No nodes found matching your query.
        </td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((d, index) => {
        const date = d.last_seen ? new Date(d.last_seen * 1000).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) : 'Never';
        const battery = d.telemetry?.battery_level ? `${d.telemetry.battery_level}%` : 'N/A';
        const freeGb = d.telemetry?.storage_free_mb ? `${(d.telemetry.storage_free_mb / 1024).toFixed(1)} GB` : 'N/A';
        const isOnline = d.status === 'ONLINE';

        return `
          <tr class="animate-in" style="animation-delay: ${index * 0.03}s">
            <td>
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <div style="width: 8px; height: 8px; border-radius: 50%; background: ${isOnline ? 'var(--accent-emerald)' : 'var(--text-muted)'}; box-shadow: ${isOnline ? '0 0 8px var(--accent-emerald)' : 'none'};"></div>
                <div>
                  <div style="font-weight: 600; color: var(--text-primary);">${escapeHtml(d.name)}</div>
                  <div style="font-size: 0.7rem; color: var(--text-muted); font-family: var(--font-mono);">${d.id.substring(0, 12)}...</div>
                </div>
              </div>
            </td>
            <td style="font-size: 0.85rem;">${escapeHtml(d.model)}</td>
            <td style="font-size: 0.85rem;">Android ${escapeHtml(d.android_version)}</td>
            <td><span class="status-badge ${d.status.toLowerCase()}">${d.status}</span></td>
            <td style="font-weight: 600; font-size: 0.85rem; color: ${d.telemetry?.battery_level <= 20 ? 'var(--accent-rose)' : 'inherit'}">${battery}</td>
            <td style="font-size: 0.85rem;">${freeGb}</td>
            <td style="font-size: 0.8rem; color: var(--text-secondary);">${date}</td>
            <td style="text-align: right;">
              <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                <a href="/device-details?id=${d.id}" class="btn btn-secondary btn-sm" style="padding: 0.3rem 0.6rem;">Inspect</a>
                <button class="btn btn-danger btn-sm" style="padding: 0.3rem 0.6rem;" onclick="revokeDevice('${d.id}')">Revoke</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function revokeDevice(id) {
      if (!confirm(`Are you sure you want to permanently revoke credentials for node ${id}?`)) return;
      try {
        await API.post(`/api/v1/devices/${id}/revoke`, {});
        loadDevices();
      } catch (err) {
        alert(err.message || 'Failed to revoke device');
      }
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    socket.connect();
    socket.on('device_status_changed', () => loadDevices());
    loadDevices();
  </script>
</body>
</html>
