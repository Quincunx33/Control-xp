<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Registry - NEXUS REMOTE</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div>
          <div class="brand-title">NEXUS REMOTE</div>
          <span class="brand-badge">Secured</span>
        </div>
      </div>

      <ul class="nav-links">
        <li class="nav-item"><a href="/dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Dashboard
        </a></li>
        <li class="nav-item active"><a href="/devices">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
          Devices
        </a></li>
        <li class="nav-item"><a href="/sessions">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          Sessions
        </a></li>
        <li class="nav-item"><a href="/settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Settings
        </a></li>
      </ul>

      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-sm" style="width: 100%;" onclick="API.logout()">
          Terminate Session
        </button>
      </div>
    </aside>

    <main class="main-wrapper">
      <header class="top-bar">
        <h1 class="top-bar-title">Device Fleet Registry</h1>
        <div class="top-bar-actions">
          <input type="text" id="device-search" class="form-input" placeholder="Search devices by name, model..." style="width: 260px; padding: 0.4rem 0.75rem; font-size: 0.825rem;" oninput="filterDevices()">
          <button class="btn btn-primary btn-sm" onclick="window.location.href='/dashboard'">+ Pair Device</button>
        </div>
      </header>

      <div class="content-body">
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Device Name</th>
                <th>Hardware Model</th>
                <th>Android Version</th>
                <th>Status</th>
                <th>Battery</th>
                <th>Storage</th>
                <th>Last Seen</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="devices-tbody">
              <tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 3rem;">Loading device fleet...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/websocket.js"></script>
  <script>
    if (!API.isAuthenticated()) window.location.href = '/login';

    let allDevices = [];

    async function loadDevices() {
      try {
        const res = await API.get('/api/v1/devices');
        allDevices = res.devices || [];
        filterDevices();
      } catch (e) {
        console.error(e);
      }
    }

    function filterDevices() {
      const q = (document.getElementById('device-search').value || '').toLowerCase();
      const tbody = document.getElementById('devices-tbody');

      const filtered = allDevices.filter(d =>
        d.name.toLowerCase().includes(q) ||
        d.model.toLowerCase().includes(q) ||
        d.id.toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 2rem;">No matching devices found in registry.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(d => {
        const date = d.last_seen ? new Date(d.last_seen * 1000).toLocaleString() : 'Never';
        const battery = d.telemetry?.battery_level ? `${d.telemetry.battery_level}%` : 'N/A';
        const freeGb = d.telemetry?.storage_free_mb ? `${(d.telemetry.storage_free_mb / 1024).toFixed(1)} GB` : 'N/A';

        return `
          <tr>
            <td style="font-weight: 600;">
              <a href="/device-details?id=${d.id}" style="color: var(--text-primary); text-decoration: underline;">
                ${escapeHtml(d.name)}
              </a>
              <div style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono);">${d.id}</div>
            </td>
            <td>${escapeHtml(d.model)}</td>
            <td>Android ${escapeHtml(d.android_version)}</td>
            <td><span class="status-badge ${d.status.toLowerCase()}">${d.status}</span></td>
            <td>${battery}</td>
            <td>${freeGb}</td>
            <td style="font-size: 0.8rem; color: var(--text-secondary);">${date}</td>
            <td>
              <div style="display: flex; gap: 0.4rem;">
                <a href="/device-details?id=${d.id}" class="btn btn-primary btn-sm">Manage</a>
                <button class="btn btn-danger btn-sm" onclick="revokeDevice('${d.id}')">Revoke</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function revokeDevice(id) {
      if (!confirm(`Are you sure you want to permanently revoke credentials for device ${id}?`)) return;
      try {
        await API.post(`/api/v1/devices/${id}/revoke`, {});
        loadDevices();
      } catch (err) {
        alert(err.message || 'Failed to revoke device');
      }
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    socket.connect();
    socket.on('device_status_changed', () => loadDevices());
    loadDevices();
  </script>
</body>
</html>
